<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080B">
<title>Av1ate Crew</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@300;400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --ink:#07080B; --panel:#101219; --panel2:#161923; --line:rgba(255,255,255,.12);
    --text:#F4F2EC; --muted:rgba(255,255,255,.58);
    --gold:#C9A24A; --gold-hi:#F0DCA4; --gold-soft:rgba(201,162,74,.14);
    --green:#7FCB9B; --red:#F0A65C;
    --f-display:"Poppins","Helvetica Neue",Arial,sans-serif;
    --f-body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  a{color:var(--gold-hi);}
  .wrap{max-width:40rem;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) 1rem calc(5rem + env(safe-area-inset-bottom));}
  .eyebrow{font-family:var(--f-display);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0;}
  h1{font-family:var(--f-display);font-weight:300;font-size:1.5rem;margin:.2rem 0 1rem;}
  h3{font-family:var(--f-display);font-weight:400;font-size:1rem;margin:0 0 .6rem;}
  .login{max-width:22rem;margin:12vh auto 0;}
  .lbl{display:block;font-family:var(--f-display);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .3rem;}
  .inp{width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;}
  .inp:focus{outline:none;border-color:var(--gold);background:var(--gold-soft);}
  select.inp{appearance:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1rem;border-radius:999px;border:1px solid rgba(201,162,74,.6);background:var(--gold-soft);color:#F3E9D2;cursor:pointer;font-size:.86rem;min-height:2.5rem;}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn.solid{background:var(--gold);color:var(--ink);font-weight:600;border-color:var(--gold);}
  .btn.ghost{border-color:var(--line);background:transparent;color:var(--text);}
  .btn.warn{border-color:rgba(240,166,92,.6);background:rgba(240,166,92,.08);color:#F7D2A6;}
  .btn.sm{padding:.35rem .75rem;min-height:2.1rem;font-size:.8rem;}
  .btn.block{width:100%;margin-top:1rem;}
  .msg{margin:.8rem 0 0;font-size:.85rem;color:var(--red);min-height:1.2rem;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(7,8,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.4rem .6rem calc(.4rem + env(safe-area-inset-bottom));z-index:5;}
  .tab{flex:1;border:0;background:transparent;padding:.55rem;border-radius:10px;font-family:var(--f-display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .tab[aria-selected="true"]{color:var(--ink);background:var(--gold);}
  .card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem .95rem;margin-bottom:.7rem;}
  .when{font-size:.95rem;font-weight:500;margin:0;}
  .sub{font-size:.82rem;color:var(--muted);margin:.2rem 0 0;}
  .pill{display:inline-block;margin-top:.45rem;font-family:var(--f-display);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .pill.confirmed{color:var(--green);border-color:rgba(127,203,155,.55);}
  .pill.new{color:var(--gold-hi);border-color:rgba(201,162,74,.6);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.55rem 0 0;font-size:.85rem;}
  .kv dt{color:var(--muted);font-size:.74rem;}
  .kv dd{margin:0;overflow-wrap:anywhere;}
  .big{font-family:var(--f-display);font-size:1.8rem;font-weight:300;margin:.1rem 0;color:var(--gold-hi);}
  .help{font-size:.8rem;color:var(--muted);margin:.3rem 0 0;}
  .sec{font-family:var(--f-display);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .5rem;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  .log{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:.45rem;}
  .log.paid{opacity:.7;}
  .log-s{display:block;font-size:.76rem;color:var(--muted);}
  .empty{color:var(--muted);text-align:center;padding:1.5rem 1rem;border:1px dashed var(--line);border-radius:14px;}
  .toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:.6rem 1rem;border-radius:999px;font-size:.85rem;z-index:6;max-width:calc(100% - 2rem);text-align:center;}
  .steps{display:grid;gap:.4rem;}
  .step{display:flex;align-items:flex-start;gap:.7rem;padding:.75rem .8rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;position:relative;font-size:.92rem;line-height:1.35;}
  .step input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;}
  .step .tick{flex:0 0 1.35rem;height:1.35rem;border-radius:6px;border:1.5px solid rgba(201,162,74,.75);display:grid;place-items:center;margin-top:.02rem;}
  .step.on{border-color:rgba(127,203,155,.55);background:rgba(127,203,155,.07);}
  .step.on .tick{background:var(--green);border-color:var(--green);}
  .step.on .tick::after{content:"";width:.34rem;height:.66rem;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .step.on .step-t{color:rgba(255,255,255,.75);}
  .step.locked,.step.locked input{cursor:default;}
  .photos .ph-h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
  .photos .ph-h label.busy{opacity:.7;pointer-events:none;}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.6rem;}
  .ph-cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);}
  .ph-cell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .ph-cell img.loading{opacity:.3;}
  .ph-cell img.broken{visibility:hidden;}
  .ph-x{position:absolute;top:.25rem;right:.25rem;width:1.7rem;height:1.7rem;border-radius:50%;border:0;background:rgba(7,8,11,.75);color:#fff;font-size:1.05rem;line-height:1;cursor:pointer;}
  .fin{margin:.2rem 0 .4rem;padding:.7rem .9rem;border-radius:12px;background:rgba(127,203,155,.1);border:1px solid rgba(127,203,155,.5);color:var(--green);font-weight:500;}
  .help.center{text-align:center;}
  .card .btn.open-job{margin-top:.6rem;}
  .toast.bad{border-color:rgba(240,166,92,.7);color:#F7D2A6;}
  .lm-bar{display:flex;justify-content:flex-end;margin-bottom:.4rem;}
  .lm-sec{font-family:var(--f-display);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .5rem;}
  .lm-help{font-size:.82rem;color:var(--muted);}
  .lm-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem;}
  .lm-chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .lm-chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:.35rem .75rem;font:inherit;font-size:.78rem;cursor:pointer;}
  .lm-chip.on{border-color:var(--gold);color:var(--text);background:rgba(201,162,74,.14);}
  .lm-search{width:100%;margin-bottom:.7rem;}
  .lm-lead{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.85rem .9rem;margin-bottom:.6rem;}
  .lm-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;}
  .lm-name{margin:0;font-weight:600;font-size:.98rem;}
  .lm-sub{margin:.15rem 0 0;font-size:.8rem;color:var(--muted);}
  .lm-pill{flex:0 0 auto;font-family:var(--f-display);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;padding:.22rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .lm-pill.s-new{color:#F0DCA4;border-color:rgba(201,162,74,.6);}
  .lm-pill.s-contacted{color:#9EC3F0;border-color:rgba(158,195,240,.5);}
  .lm-pill.s-interested{color:#F0C48C;border-color:rgba(240,196,140,.6);}
  .lm-pill.s-customer{color:#7FCB9B;border-color:rgba(127,203,155,.6);}
  .lm-fu{margin:.45rem 0 0;font-size:.8rem;color:var(--muted);}
  .lm-fu.due{color:#F0A65C;font-weight:600;}
  .lm-last{margin:.3rem 0 0;font-size:.8rem;color:rgba(255,255,255,.75);}
  .lm-acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem;}
  .lm-btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.2rem;padding:.35rem .9rem;border-radius:999px;border:1px solid rgba(201,162,74,.6);background:rgba(201,162,74,.12);color:#F3E9D2;font:inherit;font-size:.82rem;text-decoration:none;cursor:pointer;}
  .lm-btn.solid{background:#C9A24A;border-color:#C9A24A;color:#07080B;font-weight:600;}
  .lm-btn.ghost{background:transparent;border-color:var(--line);color:var(--text);}
  .lm-btn.warn{background:rgba(240,166,92,.08);border-color:rgba(240,166,92,.6);color:#F7D2A6;}
  .lm-btn:disabled{opacity:.5;}
  .lm-empty{color:var(--muted);text-align:center;padding:1.4rem 1rem;border:1px dashed var(--line);border-radius:14px;}
  .lm-ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;}
  .lm-ov[hidden]{display:none!important;}
  .lm-card{width:100%;max-width:36rem;max-height:92vh;overflow-y:auto;background:#12141B;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom));}
  .lm-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.6rem;}
  .lm-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.05rem;}
  .lm-f{display:block;margin-bottom:.6rem;}
  .lm-f span{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem;}
  .lm-in{width:100%;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;font-size:.92rem;}
  .lm-in:focus{outline:none;border-color:#C9A24A;}
  select.lm-in option{background:#12141B;}
  .lm-hist{display:flex;flex-direction:column;gap:.1rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.84rem;}
  .lm-hist b{font-weight:500;font-size:.74rem;color:var(--muted);}
  .tabs .tab{letter-spacing:.06em;font-size:.64rem;}
</style>
</head>
<body>

<section class="wrap" id="v-login" hidden>
  <div class="login">
    <p class="eyebrow">Av1ate Aircraft Detailers</p>
    <h1>Crew login</h1>
    <form id="login-form" autocomplete="on">
      <label class="lbl" for="l-email">Email</label>
      <input class="inp" id="l-email" type="email" autocomplete="username" required>
      <label class="lbl" for="l-pass">Password</label>
      <input class="inp" id="l-pass" type="password" autocomplete="current-password" required>
      <button class="btn solid block" id="l-go" type="submit">Log in</button>
    </form>
    <p class="msg" id="l-msg" role="alert"></p>
    <p class="help">No login yet? Ask Av1ate to set one up for you.</p>
  </div>
</section>

<section class="wrap" id="v-invite" hidden>
  <div class="login">
    <p class="eyebrow">Av1ate Aircraft Detailers</p>
    <h1>Set up your crew login</h1>
    <p class="help" id="inv-who">Checking your invite…</p>
    <form id="inv-form" autocomplete="on" hidden>
      <input type="email" id="inv-email" autocomplete="username" hidden>
      <label class="lbl" for="inv-pass">Choose a password</label>
      <input class="inp" id="inv-pass" type="password" autocomplete="new-password" minlength="8" required>
      <label class="lbl" for="inv-pass2">Type it again</label>
      <input class="inp" id="inv-pass2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn solid block" id="inv-go" type="submit">Create my login</button>
    </form>
    <p class="msg" id="inv-msg" role="alert"></p>
  </div>
</section>

<section class="wrap" id="v-app" hidden>
  <div class="top">
    <div><p class="eyebrow">Av1ate Crew</p><h1 id="hello">Hi</h1></div>
    <div style="display:flex;gap:.4rem;margin-bottom:1rem">
      <button class="btn ghost sm" id="refresh" type="button">Refresh</button>
    </div>
  </div>
  <div id="p-jobs"></div>
  <div id="p-hours" hidden></div>
  <div id="p-me" hidden></div>
  <div id="p-leads" hidden></div>
</section>

<nav class="tabs" id="tabs" hidden>
  <button class="tab" id="t-jobs" type="button" aria-selected="true">My jobs</button>
  <button class="tab" id="t-hours" type="button" aria-selected="false">Hours</button>
  <button class="tab" id="t-leads" type="button" aria-selected="false" hidden>Leads</button>
  <button class="tab" id="t-me" type="button" aria-selected="false">Account</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  "use strict";
  var SB_URL = "https://foljftdgygoocyjjejqr.supabase.co";
  var SB_KEY = "sb_publishable_NWi492YjLpXFhS29KF5-nQ_EAn0Ucv5";
  var BASE = String(SB_URL).replace(/\/+$/, ""), STORE = "av1-crew-session", TZ = "America/New_York";
  var session = null, me = null, jobs = [], logs = [];

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function show(id){ ["v-login","v-app","v-invite"].forEach(function(v){ $(v).hidden = (v !== id); }); $("tabs").hidden = (id !== "v-app"); }
  var toastT = 0;
  function toast(t, bad){ var e = $("toast"); e.textContent = t; e.className = "toast" + (bad ? " bad" : ""); e.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ e.hidden = true; }, 3200); }
  var ERR = {not_worker: "This login isn't set up as Av1ate crew. Ask Av1ate to check your account.", bad_hours: "Hours must be between 0 and 24.",
    bad_date: "Pick a date from the last 60 days (not in the future).", not_your_job: "That job isn't assigned to you.",
    too_many: "Too many entries for that day.", steps_left: "Check off every step on the checklist first.",
    need_before: "Add at least one Before photo first.", need_after: "Add at least one After photo first.", job_finished: "This job is already finished.",
    photo_missing: "That photo didn't upload. Try again.", too_many_photos: "That's the photo limit for this job (60).", bad_step: "That step isn't on this job's checklist.", not_allowed: "That entry can't be removed (it was added by Av1ate or is already paid)."};
  function nice(err){ var m = String(err && err.message || err || ""); for(var k in ERR){ if(m.indexOf(k) >= 0) return ERR[k]; }
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach the server. Check your connection."; return m || "Something went wrong."; }

  // ---- session ----
  function saveSession(s){ session = s; try{ if(s) localStorage.setItem(STORE, JSON.stringify(s)); else localStorage.removeItem(STORE); }catch(e){} }
  function loadSession(){ try{ var t = localStorage.getItem(STORE); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
  function fromAuth(j){ return {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600))}; }
  function authCall(grant, body){
    return fetch(BASE + "/auth/v1/token?grant_type=" + grant, {method: "POST", headers: {"apikey": SB_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || j.message || ("Login failed (" + r.status + ")"));
        return fromAuth(j); }); });
  }
  function refresh(){ if(!session || !session.refresh_token) return Promise.reject(new Error("no_session"));
    return authCall("refresh_token", {refresh_token: session.refresh_token}).then(function(s){ saveSession(s); return s; }); }
  function fresh(){ if(session && session.expires_at - 60 > Date.now()/1000) return Promise.resolve(session); return refresh(); }
  function rpc(fn, body, retried){
    return fresh().then(function(s){
      return fetch(BASE + "/rest/v1/rpc/" + fn, {method: "POST",
        headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify(body || {})});
    }).then(function(r){ return r.text().then(function(t){
      var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
      if(r.status === 401 && !retried) return refresh().then(function(){ return rpc(fn, body, true); });
      if(!r.ok) throw new Error((j && (j.message || j.msg)) || ("HTTP " + r.status));
      return j; }); })
    .catch(function(e){ if(e && (e.message === "no_session" || /refresh token|invalid_grant/i.test(e.message))){ saveSession(null); show("v-login"); } throw e; });
  }

  // ---- formatting ----
  function pad(n){ return String(n).padStart(2, "0"); }
  function todayKey(){ var p = new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); return p; }
  function prettyDay(s){ if(!s) return ""; var p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric", timeZone: "UTC"}); }
  function prettyTime(ts){ return new Date(ts).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: TZ}); }
  function money(n){ return "$" + Number(n || 0).toFixed(2); }
  function num(n){ return (Math.round(Number(n || 0) * 100) / 100).toString(); }
  function jobTime(j){ return j.start_at ? new Date(j.start_at).getTime() : (j.requested_day ? new Date(j.requested_day + "T12:00:00").getTime() : 0); }
  function jobWhen(j){ return j.requested_day ? prettyDay(j.requested_day) + (j.start_at ? " · " + prettyTime(j.start_at) + " – " + prettyTime(new Date(new Date(j.start_at).getTime() + 5*3600000).toISOString()) : " · time TBD") : "Date TBD"; }
  function jobShort(j){ return jobWhen(j) + (j.aircraft || j.tail ? " · " + [j.aircraft, j.tail].filter(Boolean).join(" ") : ""); }

  // ---- job checklist & photos ----
  var JOB_BUCKET = "job-photos", jobCache = {}, openId = null, job = null, jobBusy = false;
  var KINDS = [["damage", "Existing damage", "Scratches, dents or chips found on the walk-around, before you start."],
               ["before", "Before", "How the aircraft looked when you arrived."],
               ["after", "After", "The finished result."]];
  function encPath(p){ return String(p).split("/").map(encodeURIComponent).join("/"); }
  function jobImg(path){
    var img = el("img", "ph"); img.alt = "";
    if(jobCache[path]){ img.src = jobCache[path]; return img; }
    img.className += " loading";
    fresh().then(function(s){
      return fetch(BASE + "/storage/v1/object/authenticated/" + JOB_BUCKET + "/" + encPath(path), {headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token}});
    }).then(function(r){ if(!r.ok) throw new Error("photo " + r.status); return r.blob(); })
      .then(function(b){ jobCache[path] = URL.createObjectURL(b); img.src = jobCache[path]; img.classList.remove("loading"); })
      .catch(function(){ img.classList.remove("loading"); img.classList.add("broken"); });
    return img;
  }
  function shrink(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        var max = 1600, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("Could not read that photo.")); }, "image/jpeg", 0.85);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("That file isn't a photo this phone can read.")); };
      im.src = url;
    });
  }
  function uploadJobPhoto(quoteId, kind, file){
    var path = "jobs/" + quoteId + "/" + kind + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + ".jpg";
    return shrink(file).then(function(blob){
      return fresh().then(function(s){
        return fetch(BASE + "/storage/v1/object/" + JOB_BUCKET + "/" + encPath(path), {
          method: "POST",
          headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token, "Content-Type": "image/jpeg", "x-upsert": "false"},
          body: blob
        });
      }).then(function(r){

  function missing(d){
    var out = [], left = d.steps.filter(function(s){ return !s.done; }).length;
    if(left) out.push(left + " checklist step" + (left === 1 ? "" : "s"));
    if(!d.photos.some(function(p){ return p.kind === "before"; })) out.push("a Before photo");
    if(!d.photos.some(function(p){ return p.kind === "after"; })) out.push("an After photo");

    p.appendChild(list);

    p.appendChild(el("p", "sec", "Photos"));

          var i = 0;

            if(i >= files.length){ add.classList.remove("busy"); toast(files.length === 1 ? "Photo added." : files.length + " photos added."); drawJobs(); return; }
            add.firstChild.textContent = "Uploading " + (i + 1) + " of " + files.length + "…";
            uploadJobPhoto(d.quote_id, k[0], files[i]).then(function(r){ job = r; i++; next(); })
              .catch(function(e){ add.classList.remove("busy"); toast(nice(e), true); drawJobs(); });
          })();

            });

    if(!done){

          .catch(function(e){ fin.disabled = false; toast(nice(e), true); });
      });
      p.appendChild(fin);
      p.appendChild(el("p", "help center", miss.length ? "Still needed: " + miss.join(", ") + "." : "Everything's done. Tap Finish job."));
    }
  }

  function AvLeads(o){
    var box = o.el, rpc = o.rpc, toast = o.toast, isAdmin = !!o.admin;
    var leads = [], filter = "all", q = "", loaded = false;
    var KINDS = [["fbo", "FBO"], ["school", "Flight school"], ["shop", "Maintenance shop"], ["owner", "Aircraft owner"], ["club", "Flying club"], ["other", "Other"]];
    var STATUS = [["new", "New"], ["contacted", "Contacted"], ["interested", "Interested"], ["customer", "Customer"], ["no", "Not interested"]];
    var QUICK = ["Left voicemail", "No answer", "Talked: interested", "Talked: not right now", "Sent info / flyer", "Booked a job!"];
    function E(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
    function label(list, k){ for(var i = 0; i < list.length; i++) if(list[i][0] === k) return list[i][1]; return k || ""; }
    function today(){ return new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); }
    function addDays(n){ var d = new Date(today() + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
    function pretty(d){ if(!d) return ""; var p = d.slice(0, 10).split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString("en-US", {month: "short", day: "numeric", timeZone: "UTC"}); }
    function stamp(t){ try{ return new Date(t).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}); }catch(e){ return ""; } }
    function tel(p){ return "tel:" + String(p).replace(/[^\d+]/g, ""); }
    function errMsg(e){
      var m = String(e && e.message || e || "");
      if(m.indexOf("no_leads_access") >= 0) return "Leads aren't turned on for your account.";
      if(m.indexOf("missing_name") >= 0) return "Give the lead a name.";
      return o.nice ? o.nice(e) : (m || "Something went wrong.");
    }

    // ---- modal ----
    var ov = E("div", "lm-ov"); ov.hidden = true; var card = E("div", "lm-card"); ov.appendChild(card); document.body.appendChild(ov);
    ov.addEventListener("click", function(e){ if(e.target === ov) closeM(); });
    function openM(title, build){
      card.innerHTML = ""; var h = E("div", "lm-h"); h.appendChild(E("h3", null, title));
      var x = E("button", "lm-btn ghost", "Close"); x.type = "button"; x.addEventListener("click", closeM); h.appendChild(x);
      card.appendChild(h); build(card); ov.hidden = false; document.body.style.overflow = "hidden";
    }
    function closeM(){ ov.hidden = true; document.body.style.overflow = ""; }
    function fld(lbl, input){ var w = E("label", "lm-f"); w.appendChild(E("span", null, lbl)); w.appendChild(input); return w; }
    function inp(type, v, ph){ var i = E("input", "lm-in"); i.type = type; if(v != null) i.value = v; if(ph) i.placeholder = ph; return i; }
    function sel(list, v){ var s = E("select", "lm-in"); list.forEach(function(x){ var op = new Option(x[1], x[0]); s.appendChild(op); }); s.value = v || list[0][0]; return s; }
    function btn(t, cls, fn){ var b = E("button", "lm-btn " + (cls || ""), t); b.type = "button"; b.addEventListener("click", function(){ if(b.disabled) return; b.disabled = true; Promise.resolve(fn()).then(function(){ b.disabled = false; }, function(){ b.disabled = false; }); }); return b; }

    function editLead(l){
      l = l || {};
      openM(l.id ? "Edit lead" : "Add lead", function(c){
        var name = inp("text", l.name, "Business or person"), kind = sel(KINDS, l.kind || "fbo"), contact = inp("text", l.contact, "Who to ask for");
        var phone = inp("tel", l.phone, "Phone"), email = inp("email", l.email, "Email"), airport = inp("text", l.airport, "e.g. KBLM");
        var aircraft = inp("text", l.aircraft, "Tail numbers / types"), status = sel(STATUS, l.status || "new"), fu = inp("date", l.follow_up ? l.follow_up.slice(0, 10) : "");

        [fld("Name", name), fld("Type", kind), fld("Contact person", contact), fld("Phone", phone), fld("Email", email), fld("Airport", airport),
         fld("Aircraft", aircraft), fld("Status", status), fld("Follow up on", fu), fld("Notes", notes)].forEach(function(f){ c.appendChild(f); });
        var a = E("div", "lm-acts");
        a.appendChild(btn(l.id ? "Save" : "Add lead", "solid", function(){
          return rpc("lead_save", {p: {id: l.id || "", name: name.value, kind: kind.value, contact: contact.value, phone: phone.value, email: email.value,
            airport: airport.value, aircraft: aircraft.value, status: status.value, follow_up: fu.value, notes: notes.value}})
            .then(function(){ closeM(); toast(l.id ? "Saved." : "Lead added."); return load(); }).catch(function(e){ toast(errMsg(e), true); });
        }));
        if(l.id && isAdmin) a.appendChild(btn("Archive", "warn", function(){

            hist.innerHTML = ""; (rows || []).forEach(function(g){
              var r = E("div", "lm-hist");

              r.appendChild(E("span", null, [g.note, g.status ? "→ " + label(STATUS, g.status) : null].filter(Boolean).join(" ")));
              hist.appendChild(r);
            });

          }).catch(function(){ hist.innerHTML = ""; });

    function logCall(l){
      openM("Log a call · " + l.name, function(c){
        var note = E("textarea", "lm-in"); note.rows = 3; note.placeholder = "What happened?";
        var qb = E("div", "lm-chips");
        QUICK.forEach(function(t){ var b = E("button", "lm-chip", t); b.type = "button"; b.addEventListener("click", function(){
          note.value = t;
          if(/interested/.test(t) && !/not/.test(t)) status.value = "interested";
          else if(/Booked/.test(t)) status.value = "customer";
          else if(status.value === "new") status.value = "contacted";

        c.appendChild(qb);
        c.appendChild(fld("Note", note));
        var status = sel(STATUS, l.status === "new" ? "contacted" : l.status);
        c.appendChild(fld("Status", status));
        var fu = inp("date", "");
        var fb = E("div", "lm-chips");
        [["In 3 days", 3], ["1 week", 7], ["2 weeks", 14], ["1 month", 30], ["No follow-up", -1]].forEach(function(x){
          var b = E("button", "lm-chip", x[0]); b.type = "button"; b.addEventListener("click", function(){ fu.value = x[1] < 0 ? "" : addDays(x[1]); fu.dataset.clear = x[1] < 0 ? "1" : ""; }); fb.appendChild(b);

        var a = E("div", "lm-acts");

          if(!note.value.trim()){ toast("Write a quick note first.", true); return; }
          return rpc("lead_log_add", {p_id: l.id, p_note: note.value, p_status: status.value, p_follow_up: fu.value || null, p_clear_follow_up: fu.dataset.clear === "1" && !fu.value})
            .then(function(){ closeM(); toast("Logged."); return load(); }).catch(function(e){ toast(errMsg(e), true); });
        }));
        c.appendChild(a);
      });
    }

    // ---- list ----
    function leadCard(l, due){
      var c = E("article", "lm-lead");
      var h = E("div", "lm-top");
      var t = E("div"); t.appendChild(E("p", "lm-name", l.name));
      t.appendChild(E("p", "lm-sub", [label(KINDS, l.kind), l.airport, l.contact].filter(Boolean).join(" · ")));
      h.appendChild(t); h.appendChild(E("span", "lm-pill s-" + l.status, label(STATUS, l.status))); c.appendChild(h);
      if(l.follow_up) c.appendChild(E("p", "lm-fu" + (due ? " due" : ""), (due ? "Follow up " + (l.follow_up.slice(0, 10) < today() ? "(overdue) " : "today ") : "Follow up ") + pretty(l.follow_up)));
      if(l.last_note) c.appendChild(E("p", "lm-last", "Last: " + l.last_note + (l.last_who ? " · " + l.last_who : "") + (l.last_at ? ", " + pretty(l.last_at) : "")));

    function draw(){
      box.innerHTML = "";
      var top = E("div", "lm-bar");
      top.appendChild(btn("＋ Add lead", "solid", function(){ editLead(null); }));
      box.appendChild(top);
      if(!loaded){ box.appendChild(E("p", "lm-help", "Loading…")); return; }
      var t = today();
      var due = leads.filter(function(l){ return l.follow_up && l.follow_up.slice(0, 10) <= t && l.status !== "no" && l.status !== "customer"; });
      if(due.length){
        box.appendChild(E("p", "lm-sec", "Follow up today (" + due.length + ")"));
        due.forEach(function(l){ box.appendChild(leadCard(l, true)); });
      }
      var chips = E("div", "lm-chips scroll");
      [["all", "All"]].concat(STATUS).forEach(function(s){
        var n = s[0] === "all" ? leads.length : leads.filter(function(l){ return l.status === s[0]; }).length;
        var b = E("button", "lm-chip" + (filter === s[0] ? " on" : ""), s[1] + " " + n); b.type = "button";

      var list = E("div"); box.appendChild(list);
      function drawList(){
        list.innerHTML = "";
        var ql = q.trim().toLowerCase();
        var rows = leads.filter(function(l){

          return [l.name, l.airport, l.contact, l.aircraft, l.phone, l.email, l.notes].join(" ").toLowerCase().indexOf(ql) >= 0;
        });
        if(!rows.length){ list.appendChild(E("div", "lm-empty", leads.length ? "Nothing here." : "No leads yet. Tap ＋ Add lead.")); return; }
        rows.forEach(function(l){ list.appendChild(leadCard(l, false)); });
      }
      drawList();
    }
    function load(){
      return rpc("leads_list").then(function(r){ leads = r || []; loaded = true; draw(); })
        .catch(function(e){ loaded = true; leads = []; draw(); toast(errMsg(e), true); throw e; });
    }
    draw();
    return {load: load, draw: draw};
  }

    });
  }
  function drawMe(){
    var p = $("p-me"); p.innerHTML = "";
    var c = el("div", "panel"); c.appendChild(el("h3", null, me.name));
    c.appendChild(el("p", "help", [me.role, money(me.hourly_rate) + "/hr"].filter(Boolean).join(" · ")));
    p.appendChild(c);
    var pw = el("div", "panel"); pw.appendChild(el("h3", null, "Change password"));
    var a = el("input", "inp"); a.type = "password"; a.autocomplete = "new-password"; a.placeholder = "New password (8+ characters)";
    var b = el("input", "inp"); b.type = "password"; b.autocomplete = "new-password"; b.placeholder = "Type it again"; b.style.marginTop = ".5rem";
    var go = el("button", "btn block", "Update password"); go.type = "button";
    pw.appendChild(a); pw.appendChild(b); pw.appendChild(go); p.appendChild(pw);
    go.addEventListener("click", function(){
      if(a.value.length < 8){ toast("Use at least 8 characters.", true); return; }
      if(a.value !== b.value){ toast("The two passwords don't match.", true); return; }
      go.disabled = true;
      fresh().then(function(s){ return fetch(BASE + "/auth/v1/user", {method: "PUT", headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json"}, body: JSON.stringify({password: a.value})}); })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.msg || j.message || j.error_description || "Couldn't update password."); }); })
        .then(function(){ a.value = ""; b.value = ""; toast("Password updated."); })
        .catch(function(e){ toast(nice(e), true); }).finally(function(){ go.disabled = false; });
    });
    var out = el("button", "btn ghost block", "Log out"); out.type = "button";
    out.addEventListener("click", function(){
      var s = session; saveSession(null);
      if(s) fetch(BASE + "/auth/v1/logout", {method: "POST", headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token}}).catch(function(){});
      show("v-login");
    });
    p.appendChild(out);
  }

  var cur = "jobs";
  function tab(name){
    cur = name;
    if(name === "leads" && leadsUI) leadsUI.load().catch(function(){});
    [["jobs","p-jobs","t-jobs"],["hours","p-hours","t-hours"],["me","p-me","t-me"],["leads","p-leads","t-leads"]].forEach(function(t){ $(t[1]).hidden = t[0] !== name; $(t[2]).setAttribute("aria-selected", t[0] === name ? "true" : "false"); });
    window.scrollTo(0, 0);
  }
  function drawAll(){ $("hello").textContent = "Hi, " + String(me.name || "").split(/\s+/)[0]; drawJobs(); drawHours(); drawMe(); }
  function loadAll(){
    return Promise.all([rpc("worker_me"), rpc("worker_jobs"), rpc("worker_logs")]).then(function(r){
      me = (r[0] || [])[0]; jobs = r[1] || []; logs = r[2] || [];
      checkLeads();
      if(!me) throw new Error("not_worker");
      drawAll();
    });
  }
  function start(){
    show("v-app");
    loadAll().catch(function(e){
      if(/not_worker/.test(String(e && e.message))){ saveSession(null); show("v-login"); $("l-msg").textContent = ERR.not_worker; return; }
      toast(nice(e), true);
    });
  }

  $("login-form").addEventListener("submit", function(e){
    e.preventDefault(); var go = $("l-go"); go.disabled = true; $("l-msg").textContent = "";
    authCall("password", {email: $("l-email").value.trim(), password: $("l-pass").value})
      .then(function(s){ saveSession(s); $("l-pass").value = ""; start(); })
      .catch(function(err){ $("l-msg").textContent = /Invalid login/i.test(err.message) ? "Wrong email or password." : nice(err); })
      .finally(function(){ go.disabled = false; });
  });
  $("refresh").addEventListener("click", function(){
    var p = openId ? rpc("worker_job", {p_quote: openId}).then(function(d){ job = d; drawJobs(); }) : loadAll();
    p.then(function(){ toast("Up to date."); }).catch(function(e){ toast(nice(e), true); });
  });
  $("t-jobs").addEventListener("click", function(){ tab("jobs"); });
  $("t-hours").addEventListener("click", function(){ tab("hours"); });
  $("t-me").addEventListener("click", function(){ tab("me"); });
  $("t-leads").addEventListener("click", function(){ tab("leads"); });

  // ---- invite links: crew.html#invite=TOKEN ----
  var INV_ERR = {invite_invalid: "This invite link has expired or was already used. Ask Av1ate for a new one.",
    invite_used: "This invite was already used. Log in with your email and password.",
    email_taken: "There's already a login for this email. Try logging in, or ask Av1ate for help.",
    password_length: "Use 8 to 72 characters."};
  function fnPublic(body){
    return fetch(BASE + "/functions/v1/worker-account", {method: "POST", headers: {"apikey": SB_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }
  function invMsg(e){ var m = String(e && e.message || ""); return INV_ERR[m] || nice(e); }
  var invMatch = /[#&]invite=([A-Za-z0-9_-]{20,100})/.exec(location.hash || "");
  if(invMatch){
    var invToken = invMatch[1];
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
    show("v-invite");
    fnPublic({action: "invite_info", token: invToken}).then(function(j){
      $("inv-who").textContent = "Hi " + j.name + "! Your login email is " + j.email + ". Choose a password to finish.";
      $("inv-email").value = j.email; $("inv-form").hidden = false;
    }).catch(function(e){ $("inv-who").textContent = ""; $("inv-msg").textContent = invMsg(e); });
    $("inv-form").addEventListener("submit", function(ev){
      ev.preventDefault(); $("inv-msg").textContent = "";
      var p1 = $("inv-pass").value, p2 = $("inv-pass2").value;
      if(p1.length < 8){ $("inv-msg").textContent = "Use at least 8 characters."; return; }
      if(p1 !== p2){ $("inv-msg").textContent = "The two passwords don't match."; return; }
      var go = $("inv-go"); go.disabled = true;
      fnPublic({action: "accept", token: invToken, password: p1})
        .then(function(j){ return authCall("password", {email: j.email, password: p1}); })
        .then(function(s){ saveSession(s); start(); toast("You're all set. Welcome to the crew!"); })
        .catch(function(e){ $("inv-msg").textContent = invMsg(e); })
        .finally(function(){ go.disabled = false; });
    });
  } else {
    session = loadSession();
    if(session) start(); else show("v-login");
  }
})();
</script>
</body>
</html>
