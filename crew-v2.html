<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080B">
<title>Av1ate Crew</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@300;400;500&display=swap">
<style>
  :root{
    color-scheme:dark;
    --ink:#07080B; --panel:#101219; --panel2:#161923; --line:rgba(255,255,255,.12);
    --text:#F4F2EC; --muted:rgba(255,255,255,.58);
    --gold:#C9A24A; --gold-hi:#F0DCA4; --gold-soft:rgba(201,162,74,.14);
    --green:#7FCB9B; --red:#F0A65C;
    --f-display:"Poppins","Helvetica Neue",Arial,sans-serif;
    --f-body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  a{color:var(--gold-hi);}
  .wrap{max-width:40rem;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) 1rem calc(5rem + env(safe-area-inset-bottom));}
  .eyebrow{font-family:var(--f-display);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0;}
  h1{font-family:var(--f-display);font-weight:300;font-size:1.5rem;margin:.2rem 0 1rem;}
  h3{font-family:var(--f-display);font-weight:400;font-size:1rem;margin:0 0 .6rem;}
  .login{max-width:22rem;margin:12vh auto 0;}
  .lbl{display:block;font-family:var(--f-display);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:.8rem 0 .3rem;}
  .inp{width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:inherit;}
  .inp:focus{outline:none;border-color:var(--gold);background:var(--gold-soft);}
  select.inp{appearance:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1rem;border-radius:999px;border:1px solid rgba(201,162,74,.6);background:var(--gold-soft);color:#F3E9D2;cursor:pointer;font-size:.86rem;min-height:2.5rem;}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn.solid{background:var(--gold);color:var(--ink);font-weight:600;border-color:var(--gold);}
  .btn.ghost{border-color:var(--line);background:transparent;color:var(--text);}
  .btn.warn{border-color:rgba(240,166,92,.6);background:rgba(240,166,92,.08);color:#F7D2A6;}
  .btn.sm{padding:.35rem .75rem;min-height:2.1rem;font-size:.8rem;}
  .btn.block{width:100%;margin-top:1rem;}
  .msg{margin:.8rem 0 0;font-size:.85rem;color:var(--red);min-height:1.2rem;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(7,8,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.4rem .6rem calc(.4rem + env(safe-area-inset-bottom));z-index:5;}
  .tab{flex:1;border:0;background:transparent;padding:.55rem;border-radius:10px;font-family:var(--f-display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .tab[aria-selected="true"]{color:var(--ink);background:var(--gold);}
  .card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem .95rem;margin-bottom:.7rem;}
  .when{font-size:.95rem;font-weight:500;margin:0;}
  .sub{font-size:.82rem;color:var(--muted);margin:.2rem 0 0;}
  .pill{display:inline-block;margin-top:.45rem;font-family:var(--f-display);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .pill.confirmed{color:var(--green);border-color:rgba(127,203,155,.55);}
  .pill.new{color:var(--gold-hi);border-color:rgba(201,162,74,.6);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.55rem 0 0;font-size:.85rem;}
  .kv dt{color:var(--muted);font-size:.74rem;}
  .kv dd{margin:0;overflow-wrap:anywhere;}
  .big{font-family:var(--f-display);font-size:1.8rem;font-weight:300;margin:.1rem 0;color:var(--gold-hi);}
  .help{font-size:.8rem;color:var(--muted);margin:.3rem 0 0;}
  .sec{font-family:var(--f-display);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:1.1rem 0 .5rem;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  .log{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:.45rem;}
  .log.paid{opacity:.7;}
  .log-s{display:block;font-size:.76rem;color:var(--muted);}
  .empty{color:var(--muted);text-align:center;padding:1.5rem 1rem;border:1px dashed var(--line);border-radius:14px;}
  .toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:.6rem 1rem;border-radius:999px;font-size:.85rem;z-index:6;max-width:calc(100% - 2rem);text-align:center;}
  .toast.bad{border-color:rgba(240,166,92,.7);color:#F7D2A6;}
</style>
</head>
<body>

<section class="wrap" id="v-login" hidden>
  <div class="login">
    <p class="eyebrow">Av1ate Aircraft Detailers</p>
    <h1>Crew login</h1>
    <form id="login-form" autocomplete="on">
      <label class="lbl" for="l-email">Email</label>
      <input class="inp" id="l-email" type="email" autocomplete="username" required>
      <label class="lbl" for="l-pass">Password</label>
      <input class="inp" id="l-pass" type="password" autocomplete="current-password" required>
      <button class="btn solid block" id="l-go" type="submit">Log in</button>
    </form>
    <p class="msg" id="l-msg" role="alert"></p>
    <p class="help">No login yet? Ask Av1ate to set one up for you.</p>
  </div>
</section>

<section class="wrap" id="v-invite" hidden>
  <div class="login">
    <p class="eyebrow">Av1ate Aircraft Detailers</p>
    <h1>Set up your crew login</h1>
    <p class="help" id="inv-who">Checking your invite…</p>
    <form id="inv-form" autocomplete="on" hidden>
      <input type="email" id="inv-email" autocomplete="username" hidden>
      <label class="lbl" for="inv-pass">Choose a password</label>
      <input class="inp" id="inv-pass" type="password" autocomplete="new-password" minlength="8" required>
      <label class="lbl" for="inv-pass2">Type it again</label>
      <input class="inp" id="inv-pass2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn solid block" id="inv-go" type="submit">Create my login</button>
    </form>
    <p class="msg" id="inv-msg" role="alert"></p>
  </div>
</section>

<section class="wrap" id="v-app" hidden>
  <div class="top">
    <div><p class="eyebrow">Av1ate Crew</p><h1 id="hello">Hi</h1></div>
    <div style="display:flex;gap:.4rem;margin-bottom:1rem">
      <button class="btn ghost sm" id="refresh" type="button">Refresh</button>
    </div>
  </div>
  <div id="p-jobs"></div>
  <div id="p-hours" hidden></div>
  <div id="p-me" hidden></div>
</section>

<nav class="tabs" id="tabs" hidden>
  <button class="tab" id="t-jobs" type="button" aria-selected="true">My jobs</button>
  <button class="tab" id="t-hours" type="button" aria-selected="false">Hours</button>
  <button class="tab" id="t-me" type="button" aria-selected="false">Account</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
  "use strict";
  var SB_URL = "https://foljftdgygoocyjjejqr.supabase.co";
  var SB_KEY = "sb_publishable_NWi492YjLpXFhS29KF5-nQ_EAn0Ucv5";
  var BASE = String(SB_URL).replace(/\/+$/, ""), STORE = "av1-crew-session", TZ = "America/New_York";
  var session = null, me = null, jobs = [], logs = [];

  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function show(id){ ["v-login","v-app","v-invite"].forEach(function(v){ $(v).hidden = (v !== id); }); $("tabs").hidden = (id !== "v-app"); }
  var toastT = 0;
  function toast(t, bad){ var e = $("toast"); e.textContent = t; e.className = "toast" + (bad ? " bad" : ""); e.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ e.hidden = true; }, 3200); }
  var ERR = {not_worker: "This login isn't set up as Av1ate crew. Ask Av1ate to check your account.", bad_hours: "Hours must be between 0 and 24.",
    bad_date: "Pick a date from the last 60 days (not in the future).", not_your_job: "That job isn't assigned to you.",
    too_many: "Too many entries for that day.", not_allowed: "That entry can't be removed (it was added by Av1ate or is already paid)."};
  function nice(err){ var m = String(err && err.message || err || ""); for(var k in ERR){ if(m.indexOf(k) >= 0) return ERR[k]; }
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach the server. Check your connection."; return m || "Something went wrong."; }

  // ---- session ----
  function saveSession(s){ session = s; try{ if(s) localStorage.setItem(STORE, JSON.stringify(s)); else localStorage.removeItem(STORE); }catch(e){} }
  function loadSession(){ try{ var t = localStorage.getItem(STORE); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
  function fromAuth(j){ return {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600))}; }
  function authCall(grant, body){
    return fetch(BASE + "/auth/v1/token?grant_type=" + grant, {method: "POST", headers: {"apikey": SB_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || j.message || ("Login failed (" + r.status + ")"));
        return fromAuth(j); }); });
  }
  function refresh(){ if(!session || !session.refresh_token) return Promise.reject(new Error("no_session"));
    return authCall("refresh_token", {refresh_token: session.refresh_token}).then(function(s){ saveSession(s); return s; }); }
  function fresh(){ if(session && session.expires_at - 60 > Date.now()/1000) return Promise.resolve(session); return refresh(); }
  function rpc(fn, body, retried){
    return fresh().then(function(s){
      return fetch(BASE + "/rest/v1/rpc/" + fn, {method: "POST",
        headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify(body || {})});
    }).then(function(r){ return r.text().then(function(t){
      var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
      if(r.status === 401 && !retried) return refresh().then(function(){ return rpc(fn, body, true); });
      if(!r.ok) throw new Error((j && (j.message || j.msg)) || ("HTTP " + r.status));
      return j; }); })
    .catch(function(e){ if(e && (e.message === "no_session" || /refresh token|invalid_grant/i.test(e.message))){ saveSession(null); show("v-login"); } throw e; });
  }

  // ---- formatting ----
  function pad(n){ return String(n).padStart(2, "0"); }
  function todayKey(){ var p = new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date()); return p; }
  function prettyDay(s){ if(!s) return ""; var p = s.split("-"); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])).toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric", timeZone: "UTC"}); }
  function prettyTime(ts){ return new Date(ts).toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: TZ}); }
  function money(n){ return "$" + Number(n || 0).toFixed(2); }
  function num(n){ return (Math.round(Number(n || 0) * 100) / 100).toString(); }
  function jobTime(j){ return j.start_at ? new Date(j.start_at).getTime() : (j.requested_day ? new Date(j.requested_day + "T12:00:00").getTime() : 0); }
  function jobWhen(j){ return j.requested_day ? prettyDay(j.requested_day) + (j.start_at ? " · " + prettyTime(j.start_at) + " – " + prettyTime(new Date(new Date(j.start_at).getTime() + 5*3600000).toISOString()) : " · time TBD") : "Date TBD"; }
  function jobShort(j){ return jobWhen(j) + (j.aircraft || j.tail ? " · " + [j.aircraft, j.tail].filter(Boolean).join(" ") : ""); }

  // ---- views ----
  function drawJobs(){
    var p = $("p-jobs"); p.innerHTML = "";
    var cut = Date.now() - 5*3600000;
    var up = jobs.filter(function(j){ return jobTime(j) >= cut && j.status !== "done"; }).sort(function(a, b){ return jobTime(a) - jobTime(b); });
    var past = jobs.filter(function(j){ return !(jobTime(j) >= cut && j.status !== "done"); }).sort(function(a, b){ return jobTime(b) - jobTime(a); });
    p.appendChild(el("p", "sec", "Upcoming (" + up.length + ")"));
    if(!up.length) p.appendChild(el("div", "empty", "No upcoming jobs assigned to you."));
    up.forEach(function(j){ p.appendChild(jobCard(j)); });
    p.appendChild(el("p", "sec", "Past (" + past.length + ")"));
    if(!past.length) p.appendChild(el("div", "empty", "No past jobs yet."));
    past.slice(0, 40).forEach(function(j){ p.appendChild(jobCard(j)); });
  }
  function jobCard(j){
    var c = el("article", "card");
    c.appendChild(el("p", "when", jobWhen(j)));
    c.appendChild(el("p", "sub", [j.customer, j.aircraft, j.tail].filter(Boolean).join(" · ") || "Aircraft details TBD"));
    var kv = el("dl", "kv");
    function row(k, v){ if(!v) return; kv.appendChild(el("dt", null, k)); kv.appendChild(el("dd", null, v)); }
    row("Airport", j.airport); row("Services", (j.services || []).join(", ")); row("Notes", j.notes);
    if(kv.children.length) c.appendChild(kv);
    c.appendChild(el("span", "pill " + j.status, j.status === "new" ? "not confirmed yet" : j.status));
    return c;
  }
  function drawHours(){
    var p = $("p-hours"); p.innerHTML = "";
    var pay = el("div", "panel"); pay.appendChild(el("h3", null, "Unpaid"));
    pay.appendChild(el("p", "big", money(me.owed)));
    pay.appendChild(el("p", "help", num(me.hours_unpaid) + " unpaid hours at " + money(me.hourly_rate) + "/hr · " + num(me.hours_total) + " hours all-time"));
    p.appendChild(pay);

    var f = el("div", "panel"); f.appendChild(el("h3", null, "Log hours"));
    var d = el("input", "inp"); d.type = "date"; d.value = todayKey(); d.max = todayKey();
    var h = el("input", "inp"); h.type = "number"; h.min = "0.25"; h.max = "24"; h.step = "0.25"; h.inputMode = "decimal"; h.placeholder = "e.g. 5";
    var job = el("select", "inp"); var none = el("option", null, "No specific job"); none.value = ""; job.appendChild(none);
    jobs.slice().sort(function(a, b){ return jobTime(b) - jobTime(a); }).forEach(function(j){ var o = el("option", null, jobShort(j)); o.value = j.quote_id; job.appendChild(o); });
    var note = el("input", "inp"); note.type = "text"; note.placeholder = "What you did (optional)"; note.maxLength = 1000;
    var two = el("div", "two");
    var l1 = el("label"); l1.appendChild(el("span", "lbl", "Date")); l1.appendChild(d);
    var l2 = el("label"); l2.appendChild(el("span", "lbl", "Hours")); l2.appendChild(h);
    two.appendChild(l1); two.appendChild(l2); f.appendChild(two);
    var l3 = el("label"); l3.appendChild(el("span", "lbl", "Job")); l3.appendChild(job); f.appendChild(l3);
    var l4 = el("label"); l4.appendChild(el("span", "lbl", "Note")); l4.appendChild(note); f.appendChild(l4);
    var go = el("button", "btn solid block", "Log hours"); go.type = "button"; f.appendChild(go);
    go.addEventListener("click", function(){
      var hv = Number(h.value); if(!(hv > 0 && hv <= 24)){ toast("Enter hours between 0 and 24.", true); return; }
      go.disabled = true;
      rpc("worker_log_hours", {p_date: d.value, p_hours: hv, p_quote: job.value || null, p_note: note.value || null})
        .then(function(){ toast("Hours logged."); return loadAll(); })
        .catch(function(e){ toast(nice(e), true); }).finally(function(){ go.disabled = false; });
    });
    p.appendChild(f);

    p.appendChild(el("p", "sec", "History"));
    if(!logs.length) p.appendChild(el("div", "empty", "No hours logged yet."));
    logs.forEach(function(l){
      var r = el("div", "log" + (l.paid ? " paid" : ""));
      var t = el("div"); t.appendChild(el("strong", null, prettyDay(l.work_date) + " · " + num(l.hours) + " h · " + money(l.amount)));
      t.appendChild(el("span", "log-s", [l.paid ? "Paid" : "Unpaid", l.added_by === "admin" ? "added by Av1ate" : null, l.note].filter(Boolean).join(" · ")));
      r.appendChild(t);
      if(l.added_by === "worker" && !l.paid){
        var x = el("button", "btn sm warn", "Remove"); x.type = "button";
        x.addEventListener("click", function(){
          if(!confirm("Remove this entry?")) return; x.disabled = true;
          rpc("worker_log_remove", {p_id: l.id}).then(function(){ toast("Removed."); return loadAll(); }).catch(function(e){ toast(nice(e), true); x.disabled = false; });
        });
        r.appendChild(x);
      }
      p.appendChild(r);
    });
  }
  function drawMe(){
    var p = $("p-me"); p.innerHTML = "";
    var c = el("div", "panel"); c.appendChild(el("h3", null, me.name));
    c.appendChild(el("p", "help", [me.role, money(me.hourly_rate) + "/hr"].filter(Boolean).join(" · ")));
    p.appendChild(c);
    var pw = el("div", "panel"); pw.appendChild(el("h3", null, "Change password"));
    var a = el("input", "inp"); a.type = "password"; a.autocomplete = "new-password"; a.placeholder = "New password (8+ characters)";
    var b = el("input", "inp"); b.type = "password"; b.autocomplete = "new-password"; b.placeholder = "Type it again"; b.style.marginTop = ".5rem";
    var go = el("button", "btn block", "Update password"); go.type = "button";
    pw.appendChild(a); pw.appendChild(b); pw.appendChild(go); p.appendChild(pw);
    go.addEventListener("click", function(){
      if(a.value.length < 8){ toast("Use at least 8 characters.", true); return; }
      if(a.value !== b.value){ toast("The two passwords don't match.", true); return; }
      go.disabled = true;
      fresh().then(function(s){ return fetch(BASE + "/auth/v1/user", {method: "PUT", headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token, "Content-Type": "application/json"}, body: JSON.stringify({password: a.value})}); })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.msg || j.message || j.error_description || "Couldn't update password."); }); })
        .then(function(){ a.value = ""; b.value = ""; toast("Password updated."); })
        .catch(function(e){ toast(nice(e), true); }).finally(function(){ go.disabled = false; });
    });
    var out = el("button", "btn ghost block", "Log out"); out.type = "button";
    out.addEventListener("click", function(){
      var s = session; saveSession(null);
      if(s) fetch(BASE + "/auth/v1/logout", {method: "POST", headers: {"apikey": SB_KEY, "Authorization": "Bearer " + s.access_token}}).catch(function(){});
      show("v-login");
    });
    p.appendChild(out);
  }

  var cur = "jobs";
  function tab(name){
    cur = name;
    [["jobs","p-jobs","t-jobs"],["hours","p-hours","t-hours"],["me","p-me","t-me"]].forEach(function(t){ $(t[1]).hidden = t[0] !== name; $(t[2]).setAttribute("aria-selected", t[0] === name ? "true" : "false"); });
    window.scrollTo(0, 0);
  }
  function drawAll(){ $("hello").textContent = "Hi, " + String(me.name || "").split(/\s+/)[0]; drawJobs(); drawHours(); drawMe(); }
  function loadAll(){
    return Promise.all([rpc("worker_me"), rpc("worker_jobs"), rpc("worker_logs")]).then(function(r){
      me = (r[0] || [])[0]; jobs = r[1] || []; logs = r[2] || [];
      if(!me) throw new Error("not_worker");
      drawAll();
    });
  }
  function start(){
    show("v-app");
    loadAll().catch(function(e){
      if(/not_worker/.test(String(e && e.message))){ saveSession(null); show("v-login"); $("l-msg").textContent = ERR.not_worker; return; }
      toast(nice(e), true);
    });
  }

  $("login-form").addEventListener("submit", function(e){
    e.preventDefault(); var go = $("l-go"); go.disabled = true; $("l-msg").textContent = "";
    authCall("password", {email: $("l-email").value.trim(), password: $("l-pass").value})
      .then(function(s){ saveSession(s); $("l-pass").value = ""; start(); })
      .catch(function(err){ $("l-msg").textContent = /Invalid login/i.test(err.message) ? "Wrong email or password." : nice(err); })
      .finally(function(){ go.disabled = false; });
  });
  $("refresh").addEventListener("click", function(){ loadAll().then(function(){ toast("Up to date."); }).catch(function(e){ toast(nice(e), true); }); });
  $("t-jobs").addEventListener("click", function(){ tab("jobs"); });
  $("t-hours").addEventListener("click", function(){ tab("hours"); });
  $("t-me").addEventListener("click", function(){ tab("me"); });

  // ---- invite links: crew.html#invite=TOKEN ----
  var INV_ERR = {invite_invalid: "This invite link has expired or was already used. Ask Av1ate for a new one.",
    invite_used: "This invite was already used. Log in with your email and password.",
    email_taken: "There's already a login for this email. Try logging in, or ask Av1ate for help.",
    password_length: "Use 8 to 72 characters."};
  function fnPublic(body){
    return fetch(BASE + "/functions/v1/worker-account", {method: "POST", headers: {"apikey": SB_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); });
  }
  function invMsg(e){ var m = String(e && e.message || ""); return INV_ERR[m] || nice(e); }
  var invMatch = /[#&]invite=([A-Za-z0-9_-]{20,100})/.exec(location.hash || "");
  if(invMatch){
    var invToken = invMatch[1];
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
    show("v-invite");
    fnPublic({action: "invite_info", token: invToken}).then(function(j){
      $("inv-who").textContent = "Hi " + j.name + "! Your login email is " + j.email + ". Choose a password to finish.";
      $("inv-email").value = j.email; $("inv-form").hidden = false;
    }).catch(function(e){ $("inv-who").textContent = ""; $("inv-msg").textContent = invMsg(e); });
    $("inv-form").addEventListener("submit", function(ev){
      ev.preventDefault(); $("inv-msg").textContent = "";
      var p1 = $("inv-pass").value, p2 = $("inv-pass2").value;
      if(p1.length < 8){ $("inv-msg").textContent = "Use at least 8 characters."; return; }
      if(p1 !== p2){ $("inv-msg").textContent = "The two passwords don't match."; return; }
      var go = $("inv-go"); go.disabled = true;
      fnPublic({action: "accept", token: invToken, password: p1})
        .then(function(j){ return authCall("password", {email: j.email, password: p1}); })
        .then(function(s){ saveSession(s); start(); toast("You're all set. Welcome to the crew!"); })
        .catch(function(e){ $("inv-msg").textContent = invMsg(e); })
        .finally(function(){ go.disabled = false; });
    });
  } else {
    session = loadSession();
    if(session) start(); else show("v-login");
  }
})();
</script>
</body>
</html>
